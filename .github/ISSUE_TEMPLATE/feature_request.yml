name: Feature request
description: Propose an improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What user problem should be solved? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: textarea
    id: scope
    attributes: { label: Use case and platform, description: Include privacy, performance, and compatibility impact }
    validations: { required: true }
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution
      options: ["I can implement this", "I can help test this", "I am requesting implementation"]
    validations: { required: true }
